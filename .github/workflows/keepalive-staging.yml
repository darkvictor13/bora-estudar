# Mantém o Supabase de staging acordado.
#
# O plano Free pausa projeto sem atividade (hoje, ~7 dias), e um projeto
# pausado só volta por intervenção manual no dashboard — com o site no ar e
# o banco fora. Uma consulta por dia segura com folga.
#
# Usa o MESMO caminho do deploy (`supabase link` pelo pooler + senha do banco),
# então não exige secret novo, e a consulta é de verdade: `migration list`
# conecta no Postgres e lê `supabase_migrations.schema_migrations`. Só leitura.
#
# ⚠️ O GitHub desativa workflow agendado em repositório sem commit por 60
# dias, e manda e-mail antes. Se este parar de rodar, é isso. O workflow
# agendado também só roda a partir da branch padrão.
name: Keepalive staging

on:
  schedule:
    # 08:00 em Brasília (11:00 UTC; o cron do GitHub é sempre UTC). Na hora
    # cheia o GitHub costuma atrasar a execução, o que aqui não importa.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Vincular ao projeto
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: npx supabase link --project-ref "$PROJECT_ID"

      # Falha o job (e o GitHub avisa por e-mail) se o banco não responder —
      # inclusive se o projeto já estiver pausado.
      - name: Consultar o banco
        run: npx supabase migration list --linked
