# Produção é uma decisão, não uma consequência: só sai por disparo manual.
#
# PRÉ-REQUISITO: o Environment `producao` precisa existir COM a deployment
# branch rule limitada a `main` antes do primeiro dispatch. Referenciar um
# Environment que não existe faz o GitHub criá-lo na hora, sem proteção
# nenhuma — o que parece funcionar e não protege nada.
name: Deploy produção

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA a publicar. Vazio = a ponta da main."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  # Resolve e VALIDA o commit antes de qualquer coisa acontecer.
  resolver:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolver.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Histórico completo: sem ele o `merge-base` abaixo não tem o que
          # comparar e a validação passaria por engano.
          fetch-depth: 0

      - id: resolver
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [ -z "${COMMIT}" ]; then
            sha=$(git rev-parse HEAD)
          elif ! sha=$(git rev-parse --verify --quiet "${COMMIT}^{commit}"); then
            echo "::error::commit '${COMMIT}' não existe neste repositório"
            exit 1
          fi

          # Produção só publica código que esteve na `main` — o único que passou
          # por staging. Isto fecha o furo que a deployment branch rule NÃO
          # cobre: ela valida o ref de onde o dispatch saiu, não este input.
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha não é ancestral de main; produção só publica commit que passou por staging"
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "→ publicando em produção:"
          git --no-pager log -1 --format='  %h  %s%n  %an, %ad' "$sha"

  verificar:
    needs: resolver
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolver.outputs.sha }}
      wrangler_env: producao

  banco:
    needs: [resolver, verificar]
    runs-on: ubuntu-latest
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolver.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Vincular ao projeto
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: npx supabase link --project-ref "$PROJECT_ID"

      # Em produção este dry-run costuma listar VÁRIAS migrations de uma vez:
      # produção acumula entre um deploy manual e o seguinte. É o esperado, e é
      # o único registro do que aquele lote fez. Leia antes de seguir.
      - name: O que vai ser aplicado
        run: npx supabase db push --linked --dry-run

      # NUNCA `--include-seed`.
      - name: Aplicar as migrations
        run: npx supabase db push --linked --yes

      - name: Estado final das migrations
        run: npx supabase migration list --linked

  site:
    needs: [resolver, banco]
    runs-on: ubuntu-latest
    environment: producao
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolver.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar
        run: npm ci

      # As VITE_* precisam existir AQUI, no ambiente do build: o Vite faz
      # substituição estática e a chave é assada no bundle. Configuradas como
      # variável do Worker ficariam corretas no painel e inúteis no produto.
      #
      # O DSN do Sentry entra pela mesma porta e pelo mesmo motivo, e é `vars` e
      # não `secrets` porque é público — o bundle o carrega em texto claro, como
      # a publishable key. Sem ele o SDK é removido do bundle na compilação, e
      # não só desligado.
      #
      # `SENTRY_AUTH_TOKEN` é secret de verdade: ele ENVIA. É também o que liga
      # o sourcemap — sem token, `vite.config.ts` nem o gera, para não publicar
      # o código-fonte junto com o bundle.
      #
      # `VITE_APP_VERSION` sai do `resolver`, e NÃO de `github.sha`: produção
      # publica o commit que o dispatch escolheu, que raramente é a ponta da
      # `main`. Marcar a release com o SHA errado desalinha todo stack trace.
      - name: Compilar o site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: producao
          VITE_APP_VERSION: ${{ needs.resolver.outputs.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build --workspace @bora/web

      # CINTO E SUSPENSÓRIO. O plugin do Sentry apaga os `.map` depois de
      # enviar, mas o envio pode falhar sem derrubar o build (é de propósito:
      # ver `errorHandler` em vite.config.ts). O que não pode acontecer em
      # NENHUMA hipótese é o passo seguinte publicar sourcemap — `assets` do
      # wrangler leva o `dist` inteiro, sem filtro.
      - name: Nenhum sourcemap vai para o ar
        run: find apps/web/dist -name '*.map' -print -delete

      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/web/wrangler.jsonc --env producao

  fumaca:
    needs: [resolver, site]
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolver.outputs.sha }}

      - name: Fumaça
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: scripts/fumaca.sh "$SITE_URL" "$API_URL"
